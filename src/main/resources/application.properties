spring.application.name=XH_crawlerDemo

# \u7531\u4E8E\u672C\u673A\u5F00\u542F\u4EE3\u7406\uFF0C\u8F6C\u53D1\u7AEF\u53E3\u4E3A10215,\u5982\u679C\u4F60\u672C\u5730\u6CA1\u6709\u4EE3\u7406\uFF0C\u5219\u8BBE\u7F6Efalse
# \u662F\u5426\u8D70\u4EE3\u7406
crawler.proxy.enabled=false
crawler.proxy.host=127.0.0.1
crawler.proxy.port=10215
  
# ---------- \u6570\u636E\u5E93\u914D\u7F6E ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xinhua_crawler?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
  
  # ---------- MyBatis \u5F00\u542F\u9A7C\u5CF0\u547D\u540D----------
mybatis.configuration.map-underscore-to-camel-case=true
  
  # ---------- \u5907\u9009hikari ----------
spring.datasource.hikari.initialization-fail-timeout=-1
# 数据库不可用时快速失败（默认30秒太久），保证降级探测不拖慢启动
spring.datasource.hikari.connection-timeout=5000

server.port=8080